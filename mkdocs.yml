site_name: Spotify for Creators API (Unofficial)
site_description: Unofficial, reverse-engineered API reference for Spotify for Creators (formerly Anchor.fm)
site_url: https://higuchiki.github.io/spotify-for-creators-api/
repo_url: https://github.com/higuchiki/spotify-for-creators-api
repo_name: spotify-for-creators-api
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
        - ja
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Overview: ホーム
            Authentication: 認証
            REST API: REST API リファレンス
            GraphQL API: GraphQL API
            Browser Automation: ブラウザ自動化
            Recipes: レシピ・実装例
            Changelog: 更新履歴

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Authentication: auth.md
  - REST API: rest-api.md
  - GraphQL API: graphql.md
  - Browser Automation: browser-automation.md
  - Recipes: recipes.md
  - Changelog: changelog.md

extra:
  analytics:
    provider: google
    property: G-ZKXMJ6G91Y
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/higuchiki/spotify-for-creators-api
